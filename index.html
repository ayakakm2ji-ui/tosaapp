<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>名前占い</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>名前占い</h1>
  <p class="description">あなたの名前の画数を占います。</p>

  <div class="input-area">
    <input type="text" id="nameInput" placeholder="名前を入力してください">
    <button onclick="fortune()">占う</button>
  </div>

  <div id="strokeDetail" class="stroke-detail"></div>

  <div id="loveResult" class="result-box love"></div>
  <div id="workResult" class="result-box work"></div>
  <div id="luckyResult" class="result-box lucky"></div>
</div>

<script src="script.js"></script>
</body>
</html>
