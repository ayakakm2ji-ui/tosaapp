<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>標準語→土佐弁 翻訳</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
}

.app{
  background:rgba(0,0,0,0.4);
  padding:40px;
  border-radius:20px;
  width:500px;
  text-align:center;
}

textarea{
  width:100%;
  height:120px;
  padding:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
  margin-bottom:15px;
}

button{
  padding:10px 20px;
  font-size:16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#output{
  margin-top:20px;
  font-size:18px;
  background:rgba(255,255,255,0.2);
  padding:15px;
  border-radius:10px;
}
</style>
</head>
<body>

<div class="app">
  <h2>🌊 標準語 → 土佐弁 翻訳</h2>
  <textarea id="input" placeholder="標準語を入力してください"></textarea>
  <button onclick="translateText()">翻訳する</button>
  <div id="output"></div>
</div>

<script>
function translateText(){
  let text = document.getElementById("input").value;

  const dictionary = {
    "です": "き",
    "でした":"やったわ",
    "面白い":"おもろい",
    "おもしろい":"おもろい",
    "だよ": "がよ",
    "だね": "やね",
    "している": "しゆう",
    "してる": "しゆう",
    "して": "しちょる",
    "行く": "行くき",
    "来る": "来るき",
    "だから": "やき",
    "とても": "めっちゃ",
    "本当に": "ほんまに",
    "ほんとに":"ほんまに",
    "だ": "や",
    "ない": "ないき",
    "か？":"が？",
    "ダメ":"いかん",
    "":"",,,
  };

  for(const key in dictionary){
    text = text.split(key).join(dictionary[key]);
  }

  document.getElementById("output").textContent = text;
}
</script>

</body>
</html>
